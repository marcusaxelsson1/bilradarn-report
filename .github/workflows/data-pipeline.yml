name: Refresh Bilradarn data

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bilradarn-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run data:pipeline
      - name: Commit and push validated data
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Ingen ändring att publicera."
            exit 0
          fi
          git config user.name "bilradarn-bot"
          git config user.email "bilradarn-bot@users.noreply.github.com"
          git add data/import-history.json data/research-queue.json data/research-findings src/data public/car-images
          git diff --cached --name-only | grep -E '(^|/)(raw|.*personnummer|.*person-?data)' && { echo "Rådata/PII upptäcktes i staging"; exit 1; } || true
          git commit -m "chore: refresh listings and validated data"
          git push origin HEAD:main
